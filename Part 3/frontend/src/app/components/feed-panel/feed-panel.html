<article class="feed-panel" [class.panel]="framed()">
  @if (showHeader()) {
    <div class="panel__header">
      <p class="panel__eyebrow">
        {{ eyebrow() }}
      </p>
      <h2>{{ title() }}</h2>
    </div>
  }

  @if (loading()) {
    <p class="empty-state">Loading {{ eyebrow().toLowerCase() }}</p>
  }

  @if (!loading()) {
    <div class="feed-list" [class.feed-list--compact]="compact()">
      @for (item of feed()?.items; track item.postId) {
        <app-feed-card
          [item]="item"
          [hotBadge]="badgeForUser()(item.authorId)"
          [showScore]="showScore()"
          [showReason]="showReason()"
          [secondary]="compact()"
        />
      }

      @if (feed()?.items?.length === 0) {
        <p class="empty-state">{{ emptyText() }}</p>
      }
    </div>
  }

  @if (nextCursor()) {
    <button class="feed-more" type="button" [disabled]="loadingMore()" (click)="loadMore.emit()">
      {{ loadingMore() ? 'Loading more...' : 'Load more posts' }}
    </button>
  }
</article>
