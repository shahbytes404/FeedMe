<article class="panel profile-card">
  <p class="panel__eyebrow">Current viewer</p>
  <app-user-menu
    class="profile-card__selector"
    menuId="viewer"
    [users]="users()"
    [selectedLabel]="selectedLabel()"
    [selectedBadge]="selectedBadge()"
    [open]="menuOpen()"
    (menuToggle)="menuToggle.emit({ menuId: 'viewer', event: $event })"
    (userSelected)="viewerSelected.emit($event)"
  />

  <div class="profile-card__title">
    <div>
      <h2>{{ viewer()?.name }}</h2>
      <p>@{{ viewer()?.handle }}</p>
    </div>
    @if (viewer()?.hotUser) {
      <span class="user-badge user-badge--hot">Hot user</span>
    }
  </div>
  <p class="profile-card__bio">{{ viewer()?.bio }}</p>
</article>
