<article class="feed-card" [class.feed-card--secondary]="secondary()">
  <div class="feed-card__meta">
    <div>
      <div class="feed-card__title">
        <h3>{{ item().authorName }}</h3>
        @if (hotBadge()) {
          <span class="user-badge user-badge--hot">{{ hotBadge() }}</span>
        }
      </div>
      <p>&#64;{{ item().authorHandle }}</p>
    </div>
    <span>{{ item().deliverStrategy }}</span>
  </div>

  <p class="feed-card__body">{{ item().content }}</p>

  <div class="feed-card__footer">
    @if (showScore()) {
      <small>score {{ item().rankingScore }}</small>
    }
    <small>{{ item().createdAt | date: 'medium' }}</small>
  </div>

  @if (showReason()) {
    <p class="feed-card__reason">{{ item().rankingReason }}</p>
  }
</article>
