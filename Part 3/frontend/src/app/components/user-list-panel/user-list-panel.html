<article class="panel sidebar-panel">
  <div class="panel__header">
    <p class="panel__eyebrow">{{ eyebrow() }}</p>
    <h2>{{ title() }}</h2>
  </div>

  <div class="sidebar-list">
    @for (user of users(); track user.id) {
      <article class="sidebar-user">
        <div>
          <div class="person-card__title">
            <h3>{{ user.name }}</h3>
            @if (user.hotUser) {
              <span class="user-badge user-badge--hot">Hot user</span>
            }
          </div>
          <p>@{{ user.handle }}</p>
        </div>
        <button
          type="button"
          [class.alt]="actionVariant() === 'alt'"
          (click)="actionSelected.emit(user.id)"
        >
          {{ actionLabel() }}
        </button>
      </article>
    }

    @if (users().length === 0 && emptyText()) {
      <p class="empty-state">{{ emptyText() }}</p>
    }
  </div>
</article>
